plugins {
    id 'java'
    id 'application'
    id("com.diffplug.spotless") version "8.4.0"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'catcafe.Main'
}

test {
    useJUnitPlatform()
}
